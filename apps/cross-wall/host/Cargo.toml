[package]
name = "cross-wall-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "cross-wall-app"
path = "src/main.rs"

[[bin]]
name = "cross-wall-launcher"
path = "src/bin/cross-wall-launcher.rs"

[dependencies]
bones-kernel = { path = "../../../vendor/bones/crates/bones-kernel", default-features = false, features = ["presentation", "upgrade", "desktop"] }
bones-launcher = { path = "../../../vendor/bones/crates/bones-launcher" }
egui = "0.32"
sdl3 = { version = "0.18.4", features = ["build-from-source-static", "unsafe_textures"] }
arboard = "3"
open = "5"
cross-wall-apply = { path = "../../../crates/apply" }
cross-wall-library = { path = "../../../crates/library" }
cross-wall-pexels = { path = "../../../crates/pexels" }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
