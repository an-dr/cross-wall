[package]
name = "cross-wall"
version.workspace = true
edition = "2021"
license = "MIT"

[[bin]]
name = "cross-wall-app"
path = "src/main.rs"

[dependencies]
bones-kernel = { path = "../../vendor/bones/crates/bones-kernel", default-features = false, features = ["presentation", "upgrade", "desktop"] }
sdl3 = { version = "0.18.4", features = ["build-from-source-static", "unsafe_textures"] }
open = "5"
cross-wall-apply = { path = "../../crates/cross-wall-apply" }
cross-wall-library = { path = "../../crates/cross-wall-library" }
cross-wall-sources = { path = "../../crates/cross-wall-sources" }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
