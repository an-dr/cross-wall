[package]
name = "cross-wall-pexels"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls as in bones: the Windows toolchains here cannot compile rustls's ring backend.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
